# Render Blueprint — puts main.py's config in code instead of clicking
# through the dashboard. Commit this + requirements.txt at your repo root,
# then in Render: New + -> Blueprint -> select the repo. Render reads this
# file and provisions the service automatically.
#
# You'll still be prompted to fill in the "sync: false" secrets once in the
# dashboard (Render won't let you commit real secrets into a yaml file, for
# good reason) — MONGODB_URI and your Resend API key.

services:
  - type: web
    name: nexhood-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: POLICE_EMAIL
        sync: false
